name: Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Wait for the uploaded Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable=0
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            echo "Pages artifacts found: $count (attempt $attempt)"
            if [ "$count" = "1" ]; then stable=$((stable+1)); else stable=0; fi
            if [ "$count" != "0" ] && [ "$count" != "1" ]; then echo "Multiple Pages artifacts in one run"; exit 1; fi
            if [ "$stable" -ge 3 ]; then break; fi
            sleep 5
          done
          if [ "$stable" -lt 3 ]; then echo "Artifact metadata not stable"; exit 1; fi
          # GitHub Pages deploy API can lag the Actions artifact API by a few seconds.
          sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4

# Includes the firmware-rendered Patch and Layer images committed to web/images.
