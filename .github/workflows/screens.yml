name: Capture instrument displays and publish
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/screens.yml']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  screens:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/capture-site-screens.mjs
      - name: Save actual firmware captures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/images/smktron-patch.png web/images/smktron-layer.png
          if ! git diff --cached --quiet; then
            git commit -m "Add actual Patch and Layer screen captures"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
